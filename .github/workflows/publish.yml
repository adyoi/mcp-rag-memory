name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: npm exchanges this OIDC token for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, which implements Trusted Publishing (npm >= 11.5.1).
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Diagnose OIDC exchange
        # Probe from npm/cli#8525: exchange the GitHub ID token for an npm publish
        # token directly. A 200 means the trusted-publisher binding (owner, repo,
        # workflow filename, environment) matches and a real publish will work; a
        # 404 "package not found" means it does not. continue-on-error so the
        # publish step still runs and we see the full picture in one run.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          REG=$(npm -s config get registry || true); REG=${REG%/}; : "${REG:=https://registry.npmjs.org}"
          HOST=${REG#*://}; HOST=${HOST%%/*}
          ID=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${HOST}" | jq -er .value)
          PKG=$(jq -r '.name|@uri' package.json)
          echo "package=$PKG registry=$REG workflows=$GITHUB_WORKFLOW_REF"
          curl -sS -o /tmp/exchange.json -w "exchange HTTP %{http_code}\n" \
            -H "Authorization: Bearer $ID" "$REG/-/npm/v1/oidc/token/exchange/package/$PKG" -d ""
          echo "--- body ---"; cat /tmp/exchange.json
      - name: Publish
        # Trusted Publishing (OIDC): no NODE_AUTH_TOKEN and no registry-url.
        # setup-node's registry-url writes an .npmrc bound to ${NODE_AUTH_TOKEN};
        # with no secret configured that empty value shadows the OIDC exchange and
        # npm fails with E404 before it ever calls the provenance endpoint.
        run: |
          echo "npm $(npm --version), node $(node --version)"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-no}"
          npm config get registry
          npm publish --provenance --access public
