name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, the first line that supports Trusted
          # Publishing (OIDC). Node 22 ships npm 10.9.8, which rejects the
          # short-lived OIDC exchange and falls back to needing a token.
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Report the npm identity OIDC resolved
        # Soft check: it surfaces the identity in the log early, but it must not
        # become a new failure mode if npm only exchanges the OIDC token on
        # publish. npm's own error is the authoritative signal.
        run: npm whoami || echo "::warning::could not confirm npm identity before publish"
      - name: Publish
        # No NODE_AUTH_TOKEN: setting it makes npm authenticate with the token
        # and ignore OIDC entirely, which is what silently forced 2FA before.
        run: npm publish --provenance --access public