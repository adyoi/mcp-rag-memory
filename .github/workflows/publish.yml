name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11.
          node-version: 24
          # registry-url is required on the token path: it writes the
          # .npmrc entry that binds NODE_AUTH_TOKEN to registry.npmjs.org.
          # npm does not resolve a bare NODE_AUTH_TOKEN without it.
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Publish
        # Token path, not Trusted Publishing: the token is a granular access
        # token scoped to mcp-rag-memory with --bypass-2fa, which is what the
        # npm registry requires for direct publishing.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}