name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: npm exchanges this OIDC token for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, which implements Trusted Publishing (npm >= 11.5.1).
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Publish
        # Trusted Publishing (OIDC): no NODE_AUTH_TOKEN and no registry-url.
        # setup-node's registry-url writes an .npmrc bound to ${NODE_AUTH_TOKEN};
        # with no secret configured that empty value shadows the OIDC exchange and
        # npm fails with E404 before it ever calls the provenance endpoint.
        # Idempotent: an aligned tag (e.g. a manual publish made a tag push a
        # no-op) re-triggers this workflow, so skip when the version is already
        # on the registry instead of failing with "cannot publish over".
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "mcp-rag-memory@${VER}" version >/dev/null 2>&1; then
            echo "mcp-rag-memory@${VER} is already on the registry; skipping publish."
          else
            npm publish --provenance --access public
          fi
