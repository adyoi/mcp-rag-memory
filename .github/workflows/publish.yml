name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, the first line that supports Trusted
          # Publishing (OIDC). Node 22 ships npm 10.9.8, which rejects the
          # short-lived OIDC exchange and falls back to needing a token.
          node-version: 24
          cache: npm
          # registry-url is deliberately NOT set. It makes setup-node write an
          # .npmrc containing "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          # plus always-auth, which puts npm on the token auth path: it prefers
          # that token over the OIDC exchange and authenticates as nobody
          # (E401 whoami, then E404 on publish). npm already defaults to
          # registry.npmjs.org, and Trusted Publishing needs no .npmrc entry.
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Publish
        run: |
          set +e
          npm publish --provenance --access public --loglevel=silly > /tmp/pub.txt 2>&1
          echo "===== publish output ====="
          cat /tmp/pub.txt
          LOG=$(ls -t /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)
          echo "===== npm auth diagnostics from $LOG ====="
          grep -iE "oidc|trusted|id_token|ACTIONS_ID|auth|provenance|audience" "$LOG" | head -60