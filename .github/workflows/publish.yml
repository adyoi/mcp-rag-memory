name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, the first line that supports Trusted
          # Publishing (OIDC). Node 22 ships npm 10.9.8, which rejects the
          # short-lived OIDC exchange and falls back to needing a token.
          node-version: 24
          cache: npm
          # registry-url is deliberately NOT set. It makes setup-node write an
          # .npmrc containing "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          # plus always-auth, which puts npm on the token auth path: it prefers
          # that token over the OIDC exchange and authenticates as nobody
          # (E401 whoami, then E404 on publish). npm already defaults to
          # registry.npmjs.org, and Trusted Publishing needs no .npmrc entry.
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Report the npm identity OIDC resolved
        # Hard check on purpose: if Trusted Publishing is not wired up, this is
        # where it should fail, before npm packs and uploads a tarball. A soft
        # check here previously reported the E401 and let the run continue to a
        # confusing E404.
        run: npm whoami
      - name: Publish
        # No NODE_AUTH_TOKEN: setting it makes npm authenticate with the token
        # and ignore OIDC entirely, which is what silently forced 2FA before.
        run: npm publish --provenance --access public