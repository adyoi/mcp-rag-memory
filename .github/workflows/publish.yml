name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, the first line that supports Trusted
          # Publishing (OIDC). Node 22 ships npm 10.9.8, which rejects the
          # short-lived OIDC exchange and falls back to needing a token.
          node-version: 24
          cache: npm
          # registry-url is deliberately NOT set. It makes setup-node write an
          # .npmrc containing "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          # plus always-auth, which puts npm on the token auth path: it prefers
          # that token over the OIDC exchange and authenticates as nobody
          # (E401 whoami, then E404 on publish). npm already defaults to
          # registry.npmjs.org, and Trusted Publishing needs no .npmrc entry.
      - name: Show the auth toolchain
        run: |
          node --version
          npm --version
          echo "OIDC env present: ID=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes} TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "npmrc files:"; npm config list 2>&1 | head -20
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Publish
        # npm performs the OIDC exchange itself here, and only here: `npm whoami`
        # does not, so it cannot be used as a pre-flight auth check (it always
        # fails ENEEDAUTH even when Trusted Publishing is wired up correctly).
        run: npm publish --provenance --access public